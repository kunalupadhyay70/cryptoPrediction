# Canonical configuration (Stage 2P cutover) — validated against
# config_schema.AppConfig. This is the SINGLE source of truth for runtime
# configuration; main.py loads it via config_schema.load_config and fails
# loudly on any unknown key, missing required field, or out-of-range value.
#
# The legacy sections this file used to have (exchange/database/collection/
# feature_pruning/thresholds/signal, and target.label_mode /
# target.vol_breakout_percentile / target.deadzone_threshold /
# model.use_regime_models / model.compare_stacking / backtest.bar_size_minutes
# / backtest.label_horizon_bars) are retired, not carried forward as
# compatibility fields — see config_schema.py's module docstring for the
# full list of what was deliberately NOT migrated.

data:
  exchange: "binance_futures"
  symbol: "BTCUSDT"
  interval: "5m"
  target_days: 60
  db_path: "data/market_data.db"
  rest_base_url: "https://fapi.binance.com"
  ws_base_url: "wss://fstream.binance.com/ws"
  depth_limit: 20
  trades_limit: 1000
  kline_limit: 1500
  pagination_sleep_seconds: 0.2
  incremental: true
  integrity_check: true

target:
  horizon_bars: 3               # predict 3 bars ahead = 15 minutes on 5m bars
  neutral_atr_mult: 0.3
  atr_period: 14

features:
  lag_periods: 3
  correlation_threshold: 0.95
  importance_top_k: 60
  min_fold_stability: 0.4
  include_orderbook_features: false

validation:
  n_folds: 5
  min_train_rows: 2000
  min_test_rows: 400
  # purge size is ALWAYS target.horizon_bars -- there is deliberately no
  # validation.purge_bars field (see ValidationConfig's docstring).
  embargo_bars: 0
  internal_validation_fraction: 0.2
  min_class_count: 30

models:
  random_state: 42
  logistic_regression:
    C: 1.0
    max_iter: 1000
  lightgbm:
    num_leaves: 63
    learning_rate: 0.02
    n_estimators: 1000
    min_child_samples: 50
    subsample: 0.7
    colsample_bytree: 0.7
    reg_alpha: 0.3
    reg_lambda: 2.0
    early_stopping_rounds: 75
  catboost:
    enabled: false

backtest:
  fee_bps: 4.0
  slippage_bps: 3.0
  latency_bps: 1.0
  funding_bps_per_bar: 0.5
  default_buy_threshold: 0.55
  default_sell_threshold: 0.45
  min_trades_for_tuning: 20
  threshold_sweep_min: 0.34
  threshold_sweep_max: 0.80
  threshold_sweep_step: 0.02
  initial_equity: 10000.0
  position_fraction: 1.0
  max_trades_per_day: 50.0

risk:
  enabled: false

artifacts:
  root_dir: "artifacts"
  keep_last_n_experiments: 20

experiment:
  name: "btcusdt_5m_v1"
  tags: ["v1", "ohlcv-only"]
  notes: "Stage 1-2O frozen architecture: causal ATR-scaled 3-class target, purge-aware expanding walk-forward, fold-local feature selection, LightGBM primary model."

live:
  poll_seconds: 5
  emit_every_iterations: 12    # emit every 12 * 5s = 60 seconds
  max_iterations: 100000
